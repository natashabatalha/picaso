# Synthetic WASP-39b-like transit used as the picaso-app Retrieval Analysis example.
# Built by reference/scripts/make_retrieval_example.py. Truths: T=900 K, H2O=1e-3, CO2=1e-4, radius=1.27 Rjup.
observation_type = 'transit_depth'
irradiated = true
calc_type = 'retrieval'

[InputOutput]
retrieval_output = '_default_/base_cases/retrieval_example/ultranest'

[ObservationData]
filenames = ['_default_/base_cases/retrieval_example/transit_example.csv']
data = 'transit_depth'
data_unit = 'cm**2/cm**2'
coord = 'wavelength'
coord_unit = 'um'
error = 'error'
instruments = []

[OpticalProperties]
opacity_file = '_default_/base_cases/retrieval_example/testing_file_only_H2O_CO2_example_opacities.db'
opacity_method = 'resampled'
opacity_kwargs = {}
virga_mieff = '_default_/virga/'

[object]
radius = {value=1.27, unit='Rjup'}
mass = {value=0.28, unit='Mjup'}
gravity = {value=430.0, unit='cm/s**2'} # unused: mass and radius set the gravity

[geometry]
phase = {value=0, unit='radian'}

[star]
radius = {value=0.939, unit='Rsun'}
semi_major = {value=0.0486, unit='AU'}
type = 'userfile'

[star.userfile]
filename = '_default_/base_cases/retrieval_example/star_5400K.txt'
w_unit = 'um'
f_unit = 'erg/(s*cm**2*AA)'

[temperature]
profile = 'isothermal'

[temperature.pressure]
reference = {value=1.0, unit='bar'}
min = {value=1e-6, unit='bar'}
max = {value=1e2, unit='bar'}
nlevel = 60
spacing = 'log'

[temperature.isothermal]
T = 900.0

[chemistry]
method = 'free'

[chemistry.free]
background = {gases=['H2','He'], fraction=5.667}
species = ['H2O', 'CO2']

[chemistry.free.H2O]
profile = 'constant'
value = 0.001

[chemistry.free.CO2]
profile = 'constant'
value = 0.0001

[retrieval]
mpi = false
processes = 1

[retrieval.sampler]
code = 'ultranest'
resume = false
sampler_kwargs = {}
run_kwargs = {min_num_live_points=200, show_status=false}

[retrieval.temperature.isothermal.T]
prior = 'uniform'
uniform_kwargs = {min=500.0, max=1500.0}
log = false

[retrieval.chemistry.free.H2O.value]
prior = 'uniform'
uniform_kwargs = {min=-8.0, max=-1.0}
log = true

[retrieval.chemistry.free.CO2.value]
prior = 'uniform'
uniform_kwargs = {min=-8.0, max=-1.0}
log = true

[retrieval.object.radius.value]
prior = 'uniform'
uniform_kwargs = {min=1.0, max=1.5}
log = false
