[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "picaso"
dynamic = ["version"]
description = "Exoplanet and brown dwarf spectra (transmission, thermal emission, reflected light), 1D radiative-convective climate models, and spectral fitting"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    {name = "Natasha E. Batalha", email = "natasha.e.batalha@gmail.com"},
]
license = "GPL-3.0"
license-files = ["LICENSE"]
# set by virga-exo 2.0.2 and astropy, which both need 3.11+
requires-python = ">=3.11"
keywords = [
    "exoplanets",
    "brown dwarfs",
    "substellar objects",
    "planetary atmospheres",
    "radiative transfer",
    "spectroscopy",
    "transit spectroscopy",
    "transmission spectroscopy",
    "emission spectroscopy",
    "thermal emission",
    "reflected light spectroscopy",
    "phase curves",
    "direct imaging",
    "climate models",
    "radiative-convective equilibrium",
    "retrievals",
    "JWST",
    "HWO",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "bokeh>=2.3.0,<3.9.3",
    "numpy>=2.0",
    "numba",
    "pandas",
    "joblib",
    "photutils",
    "astropy",
    "matplotlib",
    "stsynphot",
    "scipy",
    "h5py",
    "virga-exo==2.0.2",
    "xarray",
    "pooch",
    "platformdirs",
    "tqdm",
    "bibtexparser==1.4.4",
    "netcdf4",
    "h5netcdf",
    "jupytext",
    "toml",
]

[project.urls]
Homepage = "https://natashabatalha.github.io/picaso"
Documentation = "https://natashabatalha.github.io/picaso"
Tutorials = "https://natashabatalha.github.io/picaso/tutorials.html"
Source = "https://github.com/natashabatalha/picaso"
Issues = "https://github.com/natashabatalha/picaso/issues"
Changelog = "https://natashabatalha.github.io/picaso/changelog.html"
Citation = "https://natashabatalha.github.io/picaso/credit.html"

[project.optional-dependencies]
# picaso.driver (toml-driven runs and retrievals): pip install "picaso[driver]"
driver = [
    "dill",
    "dynesty",
    "schwimmbad",
    "spectres",
    "ultranest",
    "nautilus-sampler>=1.0.6",
]
# the picaso-app web UI, which is built on picaso.driver: pip install "picaso[app]"
app = [
    "picaso[driver]",
    "flask",
    "plotly",
]
# running the unit tests (see tests/): pip install -e ".[test]"
test = [
    "picaso[driver]",
    "pytest",
    "pytest-cov",
]
# building the documentation (see docs/README.md): pip install "picaso[docs]"
docs = [
    "picaso[driver]",
    "sphinx>=7",
    "pydata-sphinx-theme>=0.16",
    "myst-nb>=1.1",
    "jupytext",
    "ipykernel",
    "sphinx-design",
    "sphinx-copybutton",
    "sphinx-llms-txt>=0.7",
    "packaging",
    "plotly",
]

[tool.setuptools.packages.find]
include = ["picaso*"]
exclude = ["reference*"]

[tool.setuptools.dynamic]
version = {attr = "picaso._version.__version__"}

[tool.setuptools.package-data]
"picaso.driver_ui" = ["templates/**/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_full_data: needs the full opacity db and stellar grids, which are not in git; skipped automatically when missing",
    "needs_ck_tables: needs the resortrebin correlated-k tables in reference/opacities/resortrebin, which are not in git; skipped automatically when missing",
    "integration: slow end-to-end model runs (e.g. full climate convergence); run alone with -m integration or skip with -m 'not integration'",
]

[project.scripts]
picaso-notebooks = "picaso.integration_testing:main"
picaso-app = "picaso.driver_ui:main"
picaso-data = "picaso.data:main"
