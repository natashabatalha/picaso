[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "picaso"
version = "4.0.1"
description = "planetary intesity code for atmospheric scattering observations"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    {name = "Natasha E. Batalha", email = "natasha.e.batalha@gmail.com"},
]
license = "GPL-3.0"
requires-python = ">=3.7"
dependencies = [
    "bokeh>=2.3.0,<3.9.3",
    "numpy>=2.0",
    "numba",
    "pandas",
    "joblib",
    "photutils",
    "astropy",
    "matplotlib",
    "stsynphot",
    "sphinx",
    "scipy",
    "h5py",
    "virga-exo==2.0.2",
    "xarray",
    "pooch",
    "tqdm",
    "bibtexparser==1.4.4",
    "netcdf4",
    "h5netcdf",
    "jupytext",
    "toml",
]

[project.optional-dependencies]
# picaso.driver (toml-driven runs and retrievals): pip install "picaso[driver]"
driver = [
    "dill",
    "dynesty",
    "schwimmbad",
    "spectres",
    "ultranest",
]
# the picaso-app web UI, which is built on picaso.driver: pip install "picaso[app]"
app = [
    "picaso[driver]",
    "flask",
    "plotly",
]

[tool.setuptools.packages.find]
include = ["picaso*"]
exclude = ["reference*"]

[tool.setuptools.package-data]
"picaso.driver_ui" = ["templates/**/*.html", "static/*"]

[project.urls]
Homepage = "https://natashabatalha.github.io/picaso"
Download = "https://github.com/natashabatalha/picaso"

[project.scripts]
picaso-notebooks = "picaso.integration_testing:main"
picaso-app = "picaso.driver_ui:main"